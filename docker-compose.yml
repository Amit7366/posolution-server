# Unique project name — required because /opt/*/server would otherwise collide
# with other apps (e.g. Apivexo) that also live in a folder named "server".
name: posulation-server

services:
  server:
    container_name: posulation-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
